# ==============================================================================
# Vehicle Service Management System - Application Configuration
# Production & Cloud Ready (Render, Railway, Heroku, Docker, Local)
# ==============================================================================

spring.application.name=vehicle-service-management

# Port: dynamic PORT env variable for Cloud providers (Render, Heroku, Railway)
# Defaults to 8085 for local development
server.port=${PORT:8085}

# Default DataSource: In-Memory H2 Database (zero setup fallback)
# Can be overridden via environment variables in production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:vehicleservicedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Web Console (Available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# Jackson JSON formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Logging
logging.level.com.vehicleservice=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
